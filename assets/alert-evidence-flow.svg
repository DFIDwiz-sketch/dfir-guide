<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">관측 이벤트와 경보, 추가 맥락을 연결하는 판단 과정</title>
<desc id="desc">로그인 이벤트가 새 장치 규칙에 맞아 경보를 만든다. 같은 세션의 설정 감사와 사용자·운영자 확인을 추가해 판단한다. 실제 전달 범위와 다른 세션은 별도로 조사한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4a7680"/></marker></defs>
<rect width="760" height="350" rx="14" fill="#f3f8f9"/>
<g fill="none" stroke="#4a7680" stroke-width="2" marker-end="url(#arrow)">
<path d="M220 100H278"/><path d="M480 100H510V170H538"/><path d="M480 252H510V204H538"/>
</g>
<g font-family="system-ui,sans-serif" text-anchor="middle">
<rect x="20" y="45" width="200" height="110" rx="10" fill="white" stroke="#d0dee2"/>
<text x="120" y="74" font-size="13" fill="#51717d">관측 사실 · D05</text>
<text x="120" y="103" font-size="18" fill="#203e4b">새 장치 로그인</text>
<text x="120" y="130" font-size="13" fill="#51717d">계정 · 세션 · 시각</text>
<rect x="280" y="45" width="200" height="110" rx="10" fill="white" stroke="#d0dee2"/>
<text x="380" y="74" font-size="13" fill="#51717d">조건 일치 · D06</text>
<text x="380" y="103" font-size="18" fill="#203e4b">새 장치 경보</text>
<text x="380" y="130" font-size="13" fill="#51717d">무단 여부는 미확인</text>
<rect x="280" y="197" width="200" height="110" rx="10" fill="white" stroke="#d0dee2"/>
<text x="380" y="226" font-size="13" fill="#51717d">추가 근거 · D07·D11·D12</text>
<text x="380" y="255" font-size="18" fill="#203e4b">설정 감사와 확인</text>
<text x="380" y="282" font-size="13" fill="#51717d">관계 · 승인 · 사용자</text>
<rect x="540" y="129" width="200" height="116" rx="10" fill="#254f5c"/>
<text x="640" y="158" font-size="13" fill="#d8ebee">근거를 결합한 판단</text>
<text x="640" y="187" font-size="18" fill="white">무단 활동 조사</text>
<text x="640" y="214" font-size="13" fill="#d8ebee">범위 · 담당 · 다음 확인</text>
<text x="120" y="217" font-size="13" fill="#51717d">규칙의 일치와</text>
<text x="120" y="239" font-size="13" fill="#51717d">침해 판단을 구별합니다.</text>
<text x="640" y="291" font-size="12" fill="#51717d">메일 전달 범위 · 다른 세션</text>
<text x="640" y="313" font-size="12" fill="#51717d">후속 확인이 필요합니다.</text>
</g>
</svg>
